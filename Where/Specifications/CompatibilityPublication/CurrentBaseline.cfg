SPECIFICATION Spec

CONSTANTS
    Implementation = "current"
    Builds <- BaselineBuild
    Writers <- Viewer
    InitialServer = 0
    InitialReceipts <- NoReceipts
    InitialAccount = 1
    NextAccount = 2
    InitialReceiptAccount = 1
    MaxRefreshes = 2

INVARIANTS
    TypeOK
    NoLocalPublication
    NoAdmissionBelowKnownFloor
    OnlyEligibleRecorderPublishes
    SharedVersionNeverDecreases
    OnlineAdmissionHasDomainEvidence
    ReceiptBeforeOnlineAdmission
    OfflineReceiptIsAccountBound

PROPERTIES
    KnownVersionNeverDecreases
    ReceiptVersionNeverDecreases

CHECK_DEADLOCK TRUE
