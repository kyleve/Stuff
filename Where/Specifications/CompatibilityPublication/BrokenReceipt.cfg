SPECIFICATION Spec

CONSTANTS
    Implementation = "failedReceiptAdmits"
    Builds <- SameBuilds
    Writers <- ViewerAndWriter
    InitialServer = 0
    InitialReceipts <- NoReceipts
    InitialAccount = 1
    NextAccount = 2
    InitialReceiptAccount = 1
    MaxRefreshes = 1

INVARIANTS
    TypeOK
    NoLocalPublication
    NoAdmissionBelowKnownFloor
    OnlyEligibleRecorderPublishes
    SharedVersionNeverDecreases
    OnlineAdmissionHasDomainEvidence
    ReceiptBeforeOnlineAdmission
    OfflineReceiptIsAccountBound

PROPERTIES
