# Match the Python supplied by the supported macOS command environment.
target-version = "py39"
extend-exclude = [".agents", ".claude", ".build", "vendor", "node_modules", "Tuist/.build"]

[lint]
# Correctness first. Formatting is a separate, explicit operation.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"] # Assigned lambdas are an existing callback idiom, not a correctness failure.
