<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mobius — a place for every review</title>
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #252831; background: #ecece8; --ink: #252831; --muted: #626773; --line: #e2e3e7; --accent: #5841b7; --tint: #eeeafb; --green: #237354; }

body { margin: 0; }

button { color: inherit; cursor: pointer; }

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid #8b75d8; outline-offset: 3px; }
button { border: 0; background: none; }
svg { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

button .label { pointer-events: none; }
.lab { max-width: 1536px; margin: auto; padding: 18px 24px 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }

.avatar { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; background: #e5dfd2; color: #5d5340; }

.header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.button { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #dcdde3; border-radius: 7px; padding: 7px 11px; background: #fff; font-size: 12px; font-weight: 550; white-space: nowrap; }
.button:hover { background: #f4f3f8; }
.button.primary { color: #fff; border-color: var(--accent); background: var(--accent); }

.document-tab svg { width: 15px; height: 15px; }

.context-link { width: 100%; text-align: left; border-top: 1px solid var(--line); margin-top: 15px; padding: 17px 7px; display: flex; gap: 7px; font-size: 11px; color: #626773; }
.context-link svg { width: 14px; height: 14px; }
.document { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.document-toolbar { min-height: 63px; padding: 13px 22px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
.file-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }

.reviewed-label svg { width: 14px; height: 14px; }
.files-toggle { display: none; }
.comparison { padding: 11px 22px; min-height: 44px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #faf9fd; border-bottom: 1px solid #ece9f6; font-size: 11px; color: #635780; }
.comparison strong { font-weight: 550; }

.diff-scroll { overflow: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }

.diff-stats { color: #28714e; font-family: ui-monospace, SFMono-Regular, monospace; white-space: nowrap; }

.diff-table td { vertical-align: top; padding: 0; height: 24px; }
.diff-table .num { min-width: 38px; width: 38px; text-align: right; padding: 0 8px; color: #626773; font-size: 10px; user-select: none; }
.diff-table .sign { min-width: 24px; width: 24px; text-align: center; user-select: none; }
.diff-table .code { white-space: pre; padding-right: 24px; }
.diff-table .add { background: #eef8f1; color: #285f42; }
.diff-table .delete { background: #fff0ee; color: #8c4541; }
.diff-table .add .num { background: #e3f1e7; color: #4c705b; }
.diff-table .delete .num { background: #f9e5e2; color: #875e5a; }

.diff-table .comment { color: #626773; }
.code-end { padding: 24px 22px 48px; font-size: 10px; color: #626773; }
.empty-state { padding: 70px 24px; text-align: center; max-width: 420px; margin: auto; }
.check-circle { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: #eaf5ee; color: #2d8057; margin: 0 auto 16px; }
.empty-state h2 { font-size: 17px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 9px; }
.empty-state p { color: var(--muted); font-size: 12px; line-height: 1.8; margin-bottom: 19px; }
.status-bar { display: flex; justify-content: space-between; align-items: center; min-height: 33px; border-top: 1px solid var(--line); padding: 0 20px; gap: 12px; font-size: 10px; color: #626773; background: #fff; }
.status-bar span { display: flex; align-items: center; gap: 6px; }
.status-bar svg { width: 12px; height: 12px; }
.lab-note { max-width: 1488px; margin: auto; padding: 11px 24px; font-size: 11px; color: #626773; display: flex; justify-content: space-between; gap: 18px; line-height: 1.6; }
.lab-note strong { color: #404652; font-weight: 550; }
.search-pane { padding: 24px; overflow: auto; }
.search-pane h2 { font-size: 18px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 8px; }
.search-pane p { font-size: 12px; color: var(--muted); line-height: 1.7; }
.search-form { display: flex; align-items: center; gap: 8px; margin: 22px 0; }
.search-form input { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid #cbc8d8; border-radius: 7px; font-size: 13px; }
.search-result { display: flex; flex-direction: column; text-align: left; gap: 8px; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 12px 0; }
.search-result:hover { background: #faf9fd; }
.search-result strong { font-size: 12px; font-weight: 550; }
.search-result code { font-size: 11px; color: #626773; white-space: pre-wrap; }
.search-help { font-size: 11px; color: #626773; margin-top: 16px; }
.search-help button { color: var(--accent); text-decoration: underline; padding: 9px 5px; }
.source-callout { font-size: 11px; color: #626773; padding: 14px 22px; border-bottom: 1px solid var(--line); background: #fafafb; line-height: 1.6; }
dialog { padding: 24px; border: 1px solid #d9d9e2; border-radius: 13px; color: var(--ink); box-shadow: 0 20px 90px #27203f3b; width: min(480px, calc(100% - 32px)); }
dialog::backdrop { background: #27283855; }
.dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
dialog h2 { font-size: 18px; letter-spacing: -.4px; }
dialog p { font-size: 12px; color: var(--muted); line-height: 1.7; }
dialog label { display: block; font-size: 12px; margin: 22px 0 8px; }
dialog textarea { width: 100%; min-height: 145px; resize: vertical; font-size: 13px; line-height: 1.7; border: 1px solid #ccc9d8; border-radius: 7px; padding: 12px; }
.dialog-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; font-size: 11px; color: var(--muted); }
.drawer { padding: 0; max-height: calc(100dvh - 40px); width: min(340px, calc(100% - 32px)); }
.drawer .dialog-heading { padding: 18px 18px 0; }
.drawer-body { padding: 12px; overflow: auto; }
.drawer .file-summary { padding-top: 16px; }
.drawer .workspace-card.active { border-color: #cfc6e5; background: #f4f1fc; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); border-radius: 9px; padding: 12px 18px; background: #2b2935; box-shadow: 0 4px 18px #16151c20; color: white; font-size: 12px; z-index: 10; pointer-events: none; }
.toast:empty { display: none; }
@container (max-width: 1090px) {
 .workspace-nav { display: none; }
 .workspace-toggle { display: inline-grid; margin-right: 2px; }
 .title-group { display: flex; align-items: flex-start; gap: 7px; min-width: 0; }
 .workspace-header { padding: 18px; }
 .workspace-toggle { margin-top: -2px; }
 h1 { font-size: 19px; }
 .file-nav { width: 210px; }
 .document-toolbar { padding-left: 18px; padding-right: 18px; }
}
@container (max-width: 620px) {
 .workspace-header { padding: 16px 12px; gap: 6px; align-items: flex-start; }
 .title-group { gap: 3px; }
 h1 { font-size: 17px; line-height: 1.35; }
 .breadcrumb { font-size: 10px; margin-top: 1px; margin-bottom: 6px; }
 .pr-meta { gap: 7px; margin-top: 9px; }
 .branch { display: none; }
 .header-actions .button { width: 40px; min-height: 44px; padding: 8px; }
 .header-actions .button .label { display: none; }
 .header-actions .refresh { display: none; }
 .workspace-toggle { width: 34px; height: 44px; }
 .tabs { padding: 0 8px; gap: 0; }
 .document-tab { padding: 0 11px; }
 .file-nav { display: none; }
 .files-toggle { display: inline-grid; }
 .document-toolbar { padding: 10px 12px 10px 6px; min-height: 68px; gap: 4px; }
 .file-title { font-size: 12px; }

}
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
</style>
</head>
<body>
<header class="lab">
 <div class="lab-title"><strong>Mobius</strong><span>/ Interaction study</span><span class="sample">Sample data</span></div>
 <div class="lab-controls"><label for="viewport">Canvas</label><select id="viewport" aria-label="Preview width"><option value="auto">Responsive</option><option value="phone">Phone</option><option value="tablet">Tablet</option><option value="desktop">Desktop</option></select><button data-action="push" id="push">Simulate push</button><button data-action="reset">Reset</button></div>
</header>
<main id="stage" class="stage" data-size="auto" aria-label="Mobius interactive prototype"><div id="app" class="shell"></div></main>
<footer class="lab-note"><span><strong>Try the return visit.</strong> Mark Parser + Stable reviewed, then simulate a push. Switch PRs to resume your work.</span><span>In-memory mockup · layout hypotheses · v0.1</span></footer>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
<dialog id="draft-dialog" aria-labelledby="draft-title">
 <div class="dialog-heading"><h2 id="draft-title">Review draft</h2><button class="icon-button" data-action="close-draft" aria-label="Close draft">×</button></div>
 <p id="draft-context"></p><label for="draft">A thought to come back to</label><textarea id="draft" placeholder="Leave yourself a review note…"></textarea>
 <div class="dialog-footer"><span>Kept in this sample session</span><button class="button primary" data-action="close-draft">Keep draft</button></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Deliberately small, prepared fixtures. This is not a Git engine or a production state schema.
const icons = {
 pr: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M14 3l-3 3 3 3M11 6h3a4 4 0 0 1 4 4v7"/><circle cx="18" cy="19" r="2"/>',
 file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M8 13h8M8 17h5"/>',
 search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
 sidebar: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
 check: '<path d="m5 12 4 4L19 6"/>',
 comment: '<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 refresh: '<path d="M20 7a8 8 0 1 0 0 10M20 3v4h-4"/>',
 plus: '<path d="M12 5v14M5 12h14"/>',
 link: '<path d="m10 13 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(1 0) scale(.9)"/>',
 folder: '<path d="M3 7V5h6l2 2h10v13H3z"/>',
 chevron: '<path d="m9 5 7 7-7 7"/>'
};
const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const rows = text => text.replace(/^\n|\n$/g, '').split('\n').map(line => ({kind: line[0] === '+' ? 'add' : line[0] === '-' ? 'delete' : 'context', text: line.slice(1)}));
const parserFull = version => rows(`
 import Foundation
 
 struct Parser {
     struct Query {
         let terms: [String]
+        let scope: SearchScope
     }
 
-    func parse(_ input: String) -> Query {
+    func parse(_ input: String, in scope: SearchScope) -> Query {
         let normalized = input.trimmingCharacters(in: .whitespaces)
         let terms = normalized.split(separator: " ").map(String.init)
 
-        return Query(terms: terms)
+        return Query(
+            terms: ${version === 2 ? 'terms.filter { !$0.isEmpty }' : 'terms'},
+            scope: scope
+        )
     }
 
     func suggestions(for query: Query) -> [String] {
         guard let first = query.terms.first else {
             return []
         }
 
         return [first, first.lowercased()]
     }
 }
 
+extension Parser.Query {
+    var description: String {
+        terms.joined(separator: " ")
+    }
+
+    var isEmpty: Bool {
+        terms.isEmpty
+    }
+
+    var scopeLabel: String {
+        switch scope {
+        case .repository:
+            return "Entire repository"
+        case .workspace:
+            return "This workspace"
+        }
+    }
+}
 
 // Search stays with the pull request that opened it.
 // Navigating to a reference does not mark a file reviewed.
`);
const parserNew = rows(`
         return Query(
-            terms: terms,
+            terms: terms.filter { !$0.isEmpty },
             scope: scope
         )
`);

const referenceSource = `// Supporting source, unchanged by this pull request.

const fixtures = {

function renderReview() {

function renderSource() {

function rememberFocus(container) {

 restoreFocus(app, focused);

function toast(message) {
