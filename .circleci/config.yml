version: 2.1

parameters:
  # These runs have separate check names and never replace the required gate.
  test_impact_mode:
    type: enum
    enum: ["off", "full", "target", "snapshot", "shadow"]
    default: "off"
  test_impact_base:
    type: string
    default: "origin/main"
  manual_full_gate:
    type: enum
    enum: ["false", "true"]
    default: "false"

  installer_archive:
    type: enum
    enum: ["false", "true"]
    default: "false"
  installer_sha:
    type: string
    default: ""
  installer_channel:
    type: string
    default: ""
  installer_run:
    type: string
    default: ""
  installer_attempt:
    type: string
    default: ""
  installer_feed_url:
    type: string
    default: ""

executors:
  m4-pro-medium:
    macos:
      xcode: "27.0"
    resource_class: m4pro.medium
    shell: /bin/bash --login -eo pipefail
    environment:
      # Tool installation is required; local-development agent skills are not.
      MISE_NO_HOOKS: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
  m4-pro-large:
    macos:
      xcode: "27.0"
    resource_class: m4pro.large
    shell: /bin/bash --login -eo pipefail
    environment:
      MISE_NO_HOOKS: "1"
      GIT_LFS_SKIP_SMUDGE: "1"

commands:
  impact_prepare:
    steps:
      - run:
          name: Prepare experiment identity
          environment:
            IMPACT_MODE: << pipeline.parameters.test_impact_mode >>
            IMPACT_BASE: << pipeline.parameters.test_impact_base >>
          command: python3 Tools/test_impact_ci.py prepare --mode "$IMPACT_MODE" --base "$IMPACT_BASE" --bash-env "$BASH_ENV"

  impact_worker_plan:
    steps:
      - when:
          condition:
            or:
              - equal: ["target", << pipeline.parameters.test_impact_mode >>]
              - equal: ["snapshot", << pipeline.parameters.test_impact_mode >>]
          steps:
            - impact_prepare
            - restore_cache:
                keys:
                  - impact-plans-v1-{{ checksum ".build/test-impact/run-key" }}

  checkout_without_lfs:
    steps:
      - run:
          name: Checkout code without Git LFS
          command: |
            git clone --filter=blob:none --no-checkout \
              "<< pipeline.git.repo_url >>" .
            git checkout --detach "<< pipeline.git.revision >>"
            git config gc.auto 0

  hydrate_snapshot_references:
    steps:
      - run:
          name: Hydrate snapshot references
          command: |
            env -u GIT_LFS_SKIP_SMUDGE git lfs pull
            pointer_files="$(git grep -Il '^version https://git-lfs.github.com/spec/v1$' -- ':(glob)**/__Snapshots__/**/*.png' || true)"
            if [[ -n "$pointer_files" ]]; then
              echo "Snapshot references remain as Git LFS pointers:" >&2
              printf '%s\n' "$pointer_files" >&2
              exit 1
            fi

  configure_test_workdir:
    parameters:
      test_workdir:
        type: string
    steps:
      - run:
          name: Configure test work directory
          command: |
            printf '%s\n' 'export TEST_WORKDIR="$CIRCLE_WORKING_DIRECTORY/<< parameters.test_workdir >>"' >> "$BASH_ENV"
            mkdir -p "$CIRCLE_WORKING_DIRECTORY/<< parameters.test_workdir >>"
            chmod 700 "$CIRCLE_WORKING_DIRECTORY/<< parameters.test_workdir >>"

  validate_build_environment:
    steps:
      - run:
          name: Validate build environment
          command: |
            echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
            echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
            echo "Memory bytes: $(sysctl -n hw.memsize)"
            echo "Architecture: $(uname -m)"
            sw_vers
            xcodebuild -version
            expected_xcode_build="$(< .xcode-build-version)"
            xcode_build="$(xcodebuild -version | awk '/Build version/{print $3}')"
            if [[ "$xcode_build" != "$expected_xcode_build" ]]; then
              echo "Expected Xcode build $expected_xcode_build, found $xcode_build" >&2
              exit 1
            fi

            echo "Checkout: $(git rev-parse HEAD)"
            echo "Origin: $(git remote get-url origin)"
            if git config --local --get-regexp 'credential|extraheader' >/tmp/git-credential-config.txt 2>/dev/null; then
              echo "Unexpected persisted Git credential configuration:" >&2
              sed -E 's/(authorization:).*/\1 [REDACTED]/I' /tmp/git-credential-config.txt >&2
              exit 1
            fi

  validate_simulator_environment:
    steps:
      - run:
          name: Validate simulator environment
          command: |
            echo "Available simulator runtimes:"
            xcrun simctl list runtimes available
            if ! xcrun simctl list runtimes available | grep -Eq '^iOS 27(\.0)? '; then
              echo "An available iOS 27 simulator runtime is required" >&2
              exit 1
            fi

            selected_simulator="$(./simulator --shared --os 27.0 --no-boot)"
            echo "Selected simulator: $selected_simulator"
            xcrun simctl list devices available | grep "$selected_simulator"

  validate_runner_environment:
    steps:
      - validate_build_environment
      - validate_simulator_environment

  prepare_builder:
    parameters:
      test_workdir:
        type: string
      require_simulator:
        type: boolean
        default: true
    steps:
      - checkout_without_lfs
      - restore_cache:
          keys:
            - mise-installs-v2-{{ arch }}-{{ checksum ".mise.toml" }}
      - restore_cache:
          keys:
            - swiftpm-repositories-v2-{{ arch }}-{{ checksum "Package.resolved" }}
      - restore_cache:
          keys:
            - swiftpm-artifacts-v2-{{ arch }}-{{ checksum "Package.resolved" }}
      - run:
          name: Install pinned tools
          command: |
            if ! command -v mise >/dev/null 2>&1; then
              brew install mise
            fi
            mise trust .mise.toml
            mise install
      - run:
          name: Install site dependencies
          command: mise exec -- npm ci --prefix Tools/InstallerKit/Site
      - save_cache:
          key: mise-installs-v2-{{ arch }}-{{ checksum ".mise.toml" }}
          paths:
            - ~/.local/share/mise/installs
      - configure_test_workdir:
          test_workdir: << parameters.test_workdir >>
      - run:
          name: Generate project and resolve Swift packages
          command: |
            # Populate the immutable download caches before either test job saves them.
            started="$(python3 -c 'import time; print(time.time_ns())')"
            if mise exec -- tuist generate --no-open >"$TEST_WORKDIR/generate.log" 2>&1; then
              python3 -c 'import json,sys,time; print("CI_TIMING " + json.dumps({"phase":"generate","seconds":round((time.time_ns()-int(sys.argv[1]))/1e9,3),"status":0}, separators=(",",":")))' "$started"
            else
              status=$?
              python3 -c 'import json,sys,time; print("CI_TIMING " + json.dumps({"phase":"generate","seconds":round((time.time_ns()-int(sys.argv[1]))/1e9,3),"status":int(sys.argv[2])}, separators=(",",":")))' "$started" "$status"
              echo "error: tuist generate failed. Tail of $TEST_WORKDIR/generate.log:" >&2
              tail -n 20 "$TEST_WORKDIR/generate.log" >&2
              exit "$status"
            fi
      - save_cache:
          key: swiftpm-repositories-v2-{{ arch }}-{{ checksum "Package.resolved" }}
          paths:
            - ~/Library/Caches/org.swift.swiftpm/repositories
      - save_cache:
          key: swiftpm-artifacts-v2-{{ arch }}-{{ checksum "Package.resolved" }}
          paths:
            - ~/Library/Caches/org.swift.swiftpm/artifacts
      - validate_build_environment
      - when:
          condition: << parameters.require_simulator >>
          steps:
            - validate_simulator_environment

  prepare_worker:
    parameters:
      test_workdir:
        type: string
    steps:
      - checkout_without_lfs
      - attach_workspace:
          at: ci-test-build
      - configure_test_workdir:
          test_workdir: << parameters.test_workdir >>
      - validate_runner_environment

  run_with_timeout:
    parameters:
      step_name:
        type: string
        default: Run tests
      seconds:
        type: integer
      command:
        type: string
    steps:
      - run:
          name: << parameters.step_name >>
          no_output_timeout: 45m
          command: |
            ruby -e '
              timeout = Integer(ARGV.shift)
              started = Process.clock_gettime(Process::CLOCK_MONOTONIC)
              pid = Process.spawn(*ARGV, pgroup: true)
              loop do
                reaped = Process.waitpid(pid, Process::WNOHANG)
                if reaped
                  status = $?
                  exit(status.exitstatus || 128 + status.termsig)
                end
                if Process.clock_gettime(Process::CLOCK_MONOTONIC) - started >= timeout
                  warn "error: test command exceeded #{timeout} seconds"
                  begin Process.kill("TERM", -pid); rescue Errno::ESRCH; end
                  sleep 10
                  begin Process.kill("KILL", -pid); rescue Errno::ESRCH; end
                  begin Process.wait(pid); rescue Errno::ECHILD; end
                  exit 124
                end
                sleep 1
              end
            ' << parameters.seconds >> /bin/bash -lc '<< parameters.command >>'

  export_test_results:
    parameters:
      test_workdir:
        type: string
      output_directory:
        type: string
    steps:
      - run:
          name: Convert Xcode results to JUnit
          when: always
          command: |
            mkdir -p "<< parameters.output_directory >>"
            python3 .circleci/xcresult_to_junit.py \
              "<< parameters.test_workdir >>" \
              "<< parameters.output_directory >>/results.xml"
      - store_test_results:
          path: << parameters.output_directory >>

  collect_diagnostics:
    parameters:
      test_workdir:
        type: string
      artifact_name:
        type: string
      include_snapshot_images:
        type: boolean
        default: false
    steps:
      - run:
          name: Collect diagnostics
          when: on_fail
          command: |
            mkdir -p diagnostics/crashes
            cp -R "$HOME/Library/Logs/DiagnosticReports/." diagnostics/crashes/ 2>/dev/null || true
            cp -R "<< parameters.test_workdir >>" diagnostics/test-output
            if << parameters.include_snapshot_images >>; then
              mkdir -p diagnostics/snapshot-images
              { grep -hEo '/[^[:space:]]+\.png' "<< parameters.test_workdir >>"/*.log 2>/dev/null || true; } \
                | sort -u \
                | while IFS= read -r image; do
                    [[ -f "$image" ]] || continue
                    destination="diagnostics/snapshot-images/${image#/}"
                    mkdir -p "$(dirname "$destination")"
                    cp "$image" "$destination"
                  done
            fi
            find diagnostics "<< parameters.test_workdir >>" -maxdepth 3 | head -200
      - store_artifacts:
          path: diagnostics
          destination: << parameters.artifact_name >>/diagnostics

jobs:
  archive-where:
    executor: m4-pro-medium
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RUNNER_TEMP: /tmp/installer-archive
      WHERE_SIGNING_DIR: /tmp/installer-archive/where-signing-material
      INSTALLER_APP_ID: where
      INSTALLER_REPOSITORY: << pipeline.config.repository.name >>
      INSTALLER_REPOSITORY_URL: https://github.com/<< pipeline.config.repository.name >>
      INSTALLER_BUILD_SHA: << pipeline.parameters.installer_sha >>
      INSTALLER_CHANNEL: << pipeline.parameters.installer_channel >>
      INSTALLER_RUN: << pipeline.parameters.installer_run >>
      INSTALLER_ATTEMPT: << pipeline.parameters.installer_attempt >>
      INSTALLER_FEED_URL: << pipeline.parameters.installer_feed_url >>
    steps:
      # Both the pipeline config and this control checkout come from main.
      # The context restriction must enforce this outside branch-editable YAML.
      - checkout_without_lfs
      - validate_build_environment
      - run:
          name: Recheck eligibility and checkout the exact source commit
          command: |
            umask 077
            mkdir -p "$RUNNER_TEMP"
            python3 -m Tools.InstallerKit.circleci_archive prepare "$RUNNER_TEMP/source"
            cmp .xcode-build-version "$RUNNER_TEMP/source/.xcode-build-version"
      - run:
          name: Install archive tools
          command: |
            if ! command -v mise >/dev/null 2>&1; then
              brew install mise
            fi
            mise trust .mise.toml
            mise install
            BUNDLE_PATH=vendor/bundle BUNDLE_FROZEN=true mise exec -- bundle install
            (cd "$RUNNER_TEMP/source" && mise trust .mise.toml && mise install)
      - run:
          name: Install temporary signing material
          command: bash .github/where-signing.sh prepare
      - run:
          name: Archive and export Where Dev
          no_output_timeout: 45m
          command: |
            ./signing archive --app where --source "$RUNNER_TEMP/source" --output "$RUNNER_TEMP/output"
      - run:
          name: Validate the signed archive against the request
          command: python3 -m Tools.InstallerKit.circleci_archive validate "$RUNNER_TEMP/output/export/Where.ipa"
      - run:
          name: Remove temporary signing material
          when: always
          command: bash .github/where-signing.sh cleanup
      - store_artifacts:
          path: /tmp/installer-archive/output/export/Where.ipa
          destination: installer/Where.ipa

  build-ios-tests:
    executor: m4-pro-large
    steps:
      - prepare_builder:
          test_workdir: test-output-build
      - when:
          condition:
            or:
              - equal: ["target", << pipeline.parameters.test_impact_mode >>]
              - equal: ["snapshot", << pipeline.parameters.test_impact_mode >>]
              - equal: ["shadow", << pipeline.parameters.test_impact_mode >>]
          steps:
            - impact_prepare
            - restore_cache:
                keys:
                  - impact-tools-v1-{{ checksum ".build/test-impact/tool-key" }}-{{ checksum ".build/test-impact/tool-variant-key" }}-{{ checksum ".xcode-build-version" }}
            - run:
                name: Prepare pinned selection tools
                environment:
                  IMPACT_MODE: << pipeline.parameters.test_impact_mode >>
                command: |
                  options=()
                  if [[ "$IMPACT_MODE" == "target" ]]; then options=(--target-only); fi
                  ./test --impact bootstrap "${options[@]}"
            - save_cache:
                key: impact-tools-v1-{{ checksum ".build/test-impact/tool-key" }}-{{ checksum ".build/test-impact/tool-variant-key" }}-{{ checksum ".xcode-build-version" }}
                paths:
                  - .build/test-impact/vendor
                  - .build/test-impact/bin
      # GitHub's required format and macOS jobs own helper and host tests.
      # Start the shared simulator build without waiting for those checks.
      - run_with_timeout:
          seconds: 2700
          command: >-
            ./test --everything
            --build-artifacts "$CIRCLE_WORKING_DIRECTORY/ci-test-build"
            --no-generate --skip-architecture --skip-host-tests
      - when:
          condition:
            or:
              - equal: ["target", << pipeline.parameters.test_impact_mode >>]
              - equal: ["snapshot", << pipeline.parameters.test_impact_mode >>]
              - equal: ["shadow", << pipeline.parameters.test_impact_mode >>]
          steps:
            - run:
                name: Collect revision-bound test dependencies
                environment:
                  IMPACT_MODE: << pipeline.parameters.test_impact_mode >>
                command: python3 Tools/test_impact_ci.py collect --mode "$IMPACT_MODE"
            - when:
                condition:
                  or:
                    - equal: ["snapshot", << pipeline.parameters.test_impact_mode >>]
                    - equal: ["shadow", << pipeline.parameters.test_impact_mode >>]
                steps:
                  - save_cache:
                      key: impact-history-v1-{{ checksum ".build/test-impact/head-key" }}-{{ checksum ".build/test-impact/tool-key" }}-{{ checksum ".xcode-build-version" }}
                      paths:
                        - .build/test-impact/history
            - restore_cache:
                keys:
                  - impact-history-v1-{{ checksum ".build/test-impact/base-key" }}-{{ checksum ".build/test-impact/tool-key" }}-{{ checksum ".xcode-build-version" }}
            - run:
                name: Plan all experiment selections before test results
                environment:
                  IMPACT_MODE: << pipeline.parameters.test_impact_mode >>
                  IMPACT_BASE: << pipeline.parameters.test_impact_base >>
                command: python3 Tools/test_impact_ci.py plan --mode "$IMPACT_MODE" --base "$IMPACT_BASE"
            - save_cache:
                key: impact-plans-v1-{{ checksum ".build/test-impact/run-key" }}
                paths:
                  - .build/test-impact/plans
            - store_artifacts:
                path: .build/test-impact/history
                destination: test-impact/history
            - store_artifacts:
                path: .build/test-impact/plans
                destination: test-impact/plans
      - run:
          name: Validate changed snapshot inventory with Xcode
          command: |
            if git diff --quiet origin/main...HEAD -- \
              Project.swift ':(glob)**/SnapshotTests/**/*.swift'; then
              echo "Snapshot definitions did not change. The source-plan validation is sufficient."
              exit 0
            fi
            ./test --snapshots --shared --os 27.0 \
              --test-artifacts "$CIRCLE_WORKING_DIRECTORY/ci-test-build" \
              --enumerate-suites "$TEST_WORKDIR/suites.txt" \
              --skip-architecture
            ./snapshot-shards compare-enumeration \
              --enumeration "$TEST_WORKDIR/suites.txt"
      - persist_to_workspace:
          root: ci-test-build
          paths:
            - manifest.json
            - DerivedData/Build/Products
      - collect_diagnostics:
          test_workdir: test-output-build
          artifact_name: build-ios-tests

  test-ios:
    executor: m4-pro-medium
    steps:
      - checkout_without_lfs
      - configure_test_workdir:
          test_workdir: test-output-ios
      - impact_worker_plan
      - when:
          condition:
            or:
              - equal: ["target", << pipeline.parameters.test_impact_mode >>]
              - equal: ["snapshot", << pipeline.parameters.test_impact_mode >>]
          steps:
            - run:
                name: Select experimental unit bundles
                environment:
                  IMPACT_MODE: << pipeline.parameters.test_impact_mode >>
                command: |
                  python3 Tools/test_impact_ci.py worker --mode "$IMPACT_MODE" --kind unit --output "$TEST_WORKDIR/units.txt"
                  if [[ ! -s "$TEST_WORKDIR/units.txt" ]]; then
                    echo "No unit bundles selected by this experiment."
                    circleci-agent step halt
                  fi
      - attach_workspace:
          at: ci-test-build
      - validate_runner_environment
      - run_with_timeout:
          seconds: 2700
          command: |
            filters=()
            if [[ -f "$TEST_WORKDIR/units.txt" ]]; then
              filters=(--only-file "$TEST_WORKDIR/units.txt")
            fi
            ./test --all --shared --os 27.0 \
              --test-artifacts "$CIRCLE_WORKING_DIRECTORY/ci-test-build" \
              --skip-architecture "${filters[@]}"
      - export_test_results:
          test_workdir: test-output-ios
          output_directory: test-results-ios
      - collect_diagnostics:
          test_workdir: test-output-ios
          artifact_name: test-ios

  build-where-audiences:
    executor: m4-pro-medium
    parallelism: 2
    steps:
      - prepare_builder:
          test_workdir: test-output-audience-build
          require_simulator: false
      - run:
          name: Select Where audience
          command: |
            case "$CIRCLE_NODE_INDEX" in
              0) scheme="Where Beta" ;;
              1) scheme="Where App Store" ;;
              *)
                echo "No Where audience for shard $CIRCLE_NODE_INDEX" >&2
                exit 1
                ;;
            esac
            printf 'export WHERE_AUDIENCE_SCHEME=%q\n' "$scheme" >> "$BASH_ENV"
            echo "Selected scheme: $scheme"
      - run_with_timeout:
          step_name: Build selected Where audience
          seconds: 2700
          command: >-
            set -o pipefail;
            mise exec -- tuist xcodebuild build
            -workspace Stuff.xcworkspace
            -scheme "$WHERE_AUDIENCE_SCHEME"
            -destination "generic/platform=iOS Simulator"
            2>&1 | tee "$TEST_WORKDIR/build.log"
      - collect_diagnostics:
          test_workdir: test-output-audience-build
          artifact_name: where-audience-build

  snapshot:
    # Shards run on isolated VMs. Keep captures serial inside each worker:
    # one Mac shares a render server, and in-process captures share host state.
    # Measurements and guards: Shared/SnapshotKitTesting/AGENTS.md.
    executor: m4-pro-medium
    parallelism: 5
    environment:
      SNAPSHOT_SETTLE_TIMEOUT_MULTIPLIER: "2"
    steps:
      - checkout_without_lfs
      - configure_test_workdir:
          test_workdir: test-output-snapshots
      - impact_worker_plan
      - run:
          name: Select deterministic snapshot shard
          command: |
            shard="$((CIRCLE_NODE_INDEX + 1))"
            ./snapshot-shards list "$shard" --total "$CIRCLE_NODE_TOTAL" \
              > "$TEST_WORKDIR/shard.txt"
            if [[ -f .build/test-impact/run-key ]]; then
              python3 Tools/test_impact_ci.py worker \
                --mode "$IMPACT_MODE" --kind snapshot \
                --assignment "$TEST_WORKDIR/shard.txt" --output "$TEST_WORKDIR/selected.txt"
              mv "$TEST_WORKDIR/selected.txt" "$TEST_WORKDIR/shard.txt"
            fi
            suite_count="$(wc -l < "$TEST_WORKDIR/shard.txt" | tr -d ' ')"
            printf 'CI_SHARD {"index":%s,"shards":%s,"suites":%s}\n' \
              "$CIRCLE_NODE_INDEX" "$CIRCLE_NODE_TOTAL" "$suite_count"
            echo "Assigned snapshot suites:"
            sed 's/^/  /' "$TEST_WORKDIR/shard.txt"
            if [[ ! -s "$TEST_WORKDIR/shard.txt" ]]; then
              echo "The snapshot intake shard is empty."
              circleci-agent step halt
            fi
          environment:
            IMPACT_MODE: << pipeline.parameters.test_impact_mode >>
      - hydrate_snapshot_references
      - attach_workspace:
          at: ci-test-build
      - validate_runner_environment
      - run_with_timeout:
          seconds: 3600
          command: >-
            ./test --snapshots --shared --os 27.0 --review --timings
            --test-artifacts "$CIRCLE_WORKING_DIRECTORY/ci-test-build"
            --only-file "$TEST_WORKDIR/shard.txt"
            --skip-architecture
      - export_test_results:
          test_workdir: test-output-snapshots
          output_directory: test-results-snapshots
      - run:
          name: Validate snapshot shard execution
          command: >-
            ./snapshot-shards verify-execution
            --assignment "$TEST_WORKDIR/shard.txt"
            --junit test-results-snapshots/results.xml
      - run:
          name: Stage snapshot suite timings
          when: always
          environment:
            IMPACT_MODE: << pipeline.parameters.test_impact_mode >>
          command: |
            mkdir -p snapshot-timing-artifact
            cp test-results-snapshots/results.xml \
              "snapshot-timing-artifact/results-$CIRCLE_NODE_INDEX.xml"
            if [[ "$IMPACT_MODE" != "off" ]]; then
              python3 Tools/test_impact_ci.py evidence --mode "$IMPACT_MODE" \
                --junit-directory snapshot-timing-artifact \
                --output "snapshot-timing-artifact/impact-evidence-$CIRCLE_NODE_INDEX.json"
            fi
      - store_artifacts:
          path: snapshot-timing-artifact
          destination: snapshot-timings
      - collect_diagnostics:
          test_workdir: test-output-snapshots
          artifact_name: snapshots
          include_snapshot_images: true

workflows:
  "iOS CI":
    # Prototype and exploratory PRs opt out with `NO-CI` in their title. Main
    # pushes and explicit full-gate runs remain mandatory.
    when: >-
      pipeline.parameters.test_impact_mode == "off" and
      (pipeline.parameters.manual_full_gate == "true" or
      (pipeline.event.name == "push" and pipeline.git.branch == "main") or
      (pipeline.event.name == "pull_request" and
      pipeline.event.github.pull_request.base.ref == "main" and
      not (pipeline.event.github.pull_request.title matches /.*NO-CI.*/)))
    jobs:
      - build-ios-tests:
          name: Build iOS Tests
      - test-ios:
          name: Build & Test (iOS)
          requires:
            - Build iOS Tests
      # Each release audience needs a complete compile. Separate workers keep
      # two serial release builds out of the workflow's critical path.
      - build-where-audiences:
          name: Build Where Audiences
          requires:
            - Build iOS Tests
      - snapshot:
          name: Snapshot Tests (iOS)
          requires:
            - Build iOS Tests

  "Test Selection Experiment":
    when: pipeline.parameters.test_impact_mode != "off"
    jobs:
      - build-ios-tests:
          name: Experiment Build iOS Tests
      - test-ios:
          name: Experiment Unit Tests
          requires: [Experiment Build iOS Tests]
      - snapshot:
          name: Experiment Snapshot Tests
          requires: [Experiment Build iOS Tests]
      - build-where-audiences:
          name: Experiment Audience Builds
          requires: [Experiment Build iOS Tests]

  "Installer Archive":
    when: >-
      pipeline.parameters.installer_archive == "true" and
      pipeline.event.name == "api" and
      pipeline.git.branch == "main" and
      pipeline.config.ref == "refs/heads/main"
    jobs:
      - archive-where:
          name: Archive Where Dev
          context: where-distribution-signing
