version: 2.1

# Select work on Linux before CircleCI allocates any macOS executors.
setup: true

parameters:
  manual_full_gate:
    type: enum
    enum: ["false", "true"]
    default: "false"
  publication_task:
    type: enum
    enum: [none, installer, flyover, pages]
    default: none
  pull_request:
    type: integer
    default: 0

jobs:

  select-workflows:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      GIT_LFS_SKIP_SMUDGE: "1"
      CI_EVENT: << pipeline.event.name >>
      CI_BASE_SHA: << pipeline.event.github.pull_request.base.sha >>
      CI_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      CI_MANUAL_FULL_GATE: << pipeline.parameters.manual_full_gate >>
    steps:
      - run:
          name: Checkout CI tools without Git LFS
          command: |
            git clone --filter=blob:none --no-checkout \
              "<< pipeline.git.repo_url >>" .
            git sparse-checkout set Tools .circleci
            git checkout --detach "<< pipeline.git.revision >>"
            git config gc.auto 0
      - run:
          name: Classify the complete PR and continue
          command: python3 -m Tools.ci_circleci

  select-publication:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      GIT_LFS_SKIP_SMUDGE: "1"
      PUBLICATION_TASK: << pipeline.parameters.publication_task >>
      PUBLICATION_PR: << pipeline.parameters.pull_request >>
      PUBLICATION_REPOSITORY: << pipeline.config.repository.name >>
      PUBLICATION_SHA: << pipeline.git.revision >>
      PUBLICATION_ATTEMPT: << pipeline.number >>
    steps:
      - run:
          name: Checkout trusted publication tools
          command: |
            git clone --filter=blob:none --no-checkout \
              "<< pipeline.git.repo_url >>" .
            git sparse-checkout set Tools .circleci .github
            git checkout --detach "<< pipeline.git.revision >>"
      - run:
          name: Plan publication and continue
          command: python3 -m Tools.ci_publication

workflows:
  "Select workflows":
    when: >-
      pipeline.parameters.publication_task == "none" and
      (pipeline.parameters.manual_full_gate == "true" or
      (pipeline.event.name == "push" and pipeline.git.branch == "main") or
      (pipeline.event.name == "pull_request" and
      pipeline.event.github.pull_request.base.ref == "main" and
      not (pipeline.event.github.pull_request.title matches /.*NO-CI.*/)))
    jobs:
      - select-workflows
  "Select publication":
    when: >-
      pipeline.parameters.publication_task != "none" and
      pipeline.git.branch == "main" and
      pipeline.config.ref == "refs/heads/main"
    jobs:
      - select-publication:
          context: github-publication
