version: 2.1

# Select work on Linux before CircleCI allocates any macOS executors.
setup: true

parameters:
  flyover_export:
    type: enum
    enum: ["false", "true"]
    default: "false"
  flyover_sha:
    type: string
    default: ""
  manual_full_gate:
    type: enum
    enum: ["false", "true"]
    default: "false"

  installer_archive:
    type: enum
    enum: ["false", "true"]
    default: "false"
  installer_app:
    type: string
    default: ""
  installer_sha:
    type: string
    default: ""
  installer_channel:
    type: string
    default: ""
  installer_run:
    type: string
    default: ""
  installer_attempt:
    type: string
    default: ""
  installer_feed_url:
    type: string
    default: ""

jobs:
  select-workflows:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      GIT_LFS_SKIP_SMUDGE: "1"
      CI_EVENT: << pipeline.event.name >>
      CI_BASE_SHA: << pipeline.event.github.pull_request.base.sha >>
      CI_HEAD_SHA: << pipeline.event.github.pull_request.head.sha >>
      CI_MANUAL_FULL_GATE: << pipeline.parameters.manual_full_gate >>
    steps:
      - run:
          name: Checkout CI tools without Git LFS
          command: |
            git clone --filter=blob:none --no-checkout \
              "<< pipeline.git.repo_url >>" .
            git sparse-checkout set Tools .circleci
            git checkout --detach "<< pipeline.git.revision >>"
            git config gc.auto 0
      - run:
