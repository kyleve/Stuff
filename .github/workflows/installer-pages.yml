name: Deploy Pages

# CircleCI builds the complete site. GitHub's Pages API requires an Actions
# OIDC token; this bridge only uploads/deploys those already-built files.
on:
  repository_dispatch:
    types: [pages-publication]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: installer-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Dispatches are wake-ups. A delayed event must not replace a newer pending
      # deployment with a stale SHA in GitHub's one-pending-run concurrency slot.
      - name: Select the latest complete generated site
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" --jq .object.sha)"
          [[ "$site_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$site_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report deployment of this exact site
        if: ${{ always() && steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_COMMIT: ${{ steps.validate.outputs.sha }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [[ "$DEPLOYMENT_STATUS" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SITE_COMMIT" \
            -f state="$state" -f context=pages-publication \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
