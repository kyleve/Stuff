name: App Install Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A replaced pending deployment is safe: each run reads the entire latest feed.
concurrency:
  group: installer-pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  MISE_NO_HOOKS: '1'
  INSTALLER_FEED_URL: ${{ vars.INSTALLER_FEED_URL || format('https://{0}.github.io/{1}/updates.json', github.repository_owner, github.event.repository.name) }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      artifact-name: ${{ env.PAGES_ARTIFACT }}
      flyover-release: ${{ steps.flyover.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install_args: node
      - name: Install site dependencies
        run: mise exec node -- npm ci
      - name: Prepare install pages, manifests, and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m Tools.InstallerKit.installer_update_site
          --published-catalog
          --repository "$GITHUB_REPOSITORY"
          --feed-url "$INSTALLER_FEED_URL"
          --output "$RUNNER_TEMP/installer-pages"
      - name: Include the latest complete Flyover atlases
        id: flyover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m Tools.flyover_pages --output "$RUNNER_TEMP/installer-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/installer-pages

  # Pages discovers the uploaded artifact by name. A deployment retry reuses the completed build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy install site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}

  retain-flyover:
    needs: [build, deploy]
    if: needs.build.outputs.flyover-release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Retain one week and at least one Flyover bundle
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_RELEASE: ${{ needs.build.outputs.flyover-release }}
        run: python3 -m Tools.flyover_retention --deployed-release "$DEPLOYED_RELEASE"
