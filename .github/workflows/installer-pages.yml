name: App Install Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A replaced pending deployment is safe: each run reads the entire latest feed.
concurrency:
  group: installer-pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  MISE_NO_HOOKS: '1'
  INSTALLER_FEED_URL: ${{ vars.INSTALLER_FEED_URL || format('https://{0}.github.io/{1}/updates.json', github.repository_owner, github.event.repository.name) }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      build-attempt: ${{ github.run_attempt }}
      artifact-name: ${{ env.PAGES_ARTIFACT }}
      flyover-release: ${{ steps.flyover.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install_args: node
      - name: Install site dependencies
        run: mise exec node -- npm ci
      - name: Prepare install pages, manifests, and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m Tools.InstallerKit.installer_update_site
          --published-catalog
          --repository "$GITHUB_REPOSITORY"
          --feed-url "$INSTALLER_FEED_URL"
          --output "$RUNNER_TEMP/installer-pages"
      - name: Include the latest complete Flyover atlases
        id: flyover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m Tools.flyover_pages --output "$RUNNER_TEMP/installer-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/installer-pages

  # Pages discovers the uploaded artifact by name. A deployment retry reuses the completed build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - &check-build
        name: Check freshness of a reused Pages build
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ATTEMPT: ${{ needs.build.outputs.build-attempt }}
        run: |
          if [[ "$BUILD_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            url="repos/$GITHUB_REPOSITORY/actions/workflows/installer-pages.yml/runs?branch=main&per_page=1"
            latest=$(gh api "$url" | jq -er '
              .workflow_runs | select(type == "array" and length == 1) | .[0]
              | select(.head_branch == "main" and all(.id, .run_number; type == "number" and . > 0 and floor == .))
              | [.run_number, .id] | @tsv')
            read -r latest_number latest_id <<< "$latest"
            if (( latest_number > GITHUB_RUN_NUMBER )) && [[ "$latest_id" != "$GITHUB_RUN_ID" ]]; then
              echo "::notice::Skipping the reused Pages build. Newer main run $latest_id superseded it."
              exit 0
            fi
            if [[ "$latest_number" != "$GITHUB_RUN_NUMBER" || "$latest_id" != "$GITHUB_RUN_ID" ]]; then
              echo "::error::The latest reported main run does not establish whether this build is current."
              exit 1
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.current == 'true'
      - name: Deploy install site
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}

  retain-flyover:
    needs: [build, deploy]
    if: needs.deploy.outputs.page-url != '' && needs.build.outputs.flyover-release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - *check-build
      - uses: actions/checkout@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          ref: main
          persist-credentials: false
      - name: Retain one week and at least one Flyover bundle
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_RELEASE: ${{ needs.build.outputs.flyover-release }}
        run: python3 -m Tools.flyover_retention --deployed-release "$DEPLOYED_RELEASE"
