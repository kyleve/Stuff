name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: SwiftFormat Lint
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: ./swiftformat --lint
      # Catalogs drift out of Xcode's serialization the moment one is written by
      # anything but Xcode, and the cost lands on whoever next builds in the IDE
      # (see "Formatting" in AGENTS.md). This rides along in the format job
      # rather than a job of its own because branch protection pins the two
      # check names.
      - name: String Catalog lint
        run: ./xcstrings --lint
      # The only thing that actually stops a stale attribution report from
      # shipping: nothing about adding or bumping a dependency forces a re-run,
      # and the app can't check itself (its test bundle can't read Package.swift).
      # Offline and sub-second, so it rides along here for the same reason the
      # catalog lint does.
      - name: Attribution report check
        run: ./attribution --check

  architecture:
    name: Bumper Bowling
    needs: format
    runs-on: xcode-27
    env:
      BUMPER_CACHE_DIR: .build/bumper-cache
      # Where evaluates in about one second; optimize the cold runner build
      # instead of spending minutes compiling SwiftSyntax in release mode.
      BUMPER_RUNNER_BUILD_CONFIGURATION: debug
    steps:
      - uses: actions/checkout@v4
      - name: Restore Bumper build cache
        id: bumper-cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-bumper-${{ hashFiles('Package.swift', 'Package.resolved', 'BumperBowling.swift', '.bumper/Sources/**/*.swift', '.bumper/Tests/**/*.swift') }}
      - name: Validate configuration
        run: swift run bumper config .
      - name: Test architecture rules
        run: swift run bumper test .
      - name: Save Bumper build cache
        if: steps.bumper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.bumper-cache.outputs.cache-primary-key }}
      - name: Enforce Where architecture
        run: swift run bumper lint . --timings

  test:
    name: Build & Test (iOS)
    needs: format
    runs-on: xcode-27
    # A cold/stalled CoreSimulator has held this job for 3.5–5 hours on the
    # xcode-27 image (a ~10 minute run), so cap it rather than letting a stuck
    # boot sit on a runner until the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      # Resolve the simulator by UDID and boot it *before* the run, rather than
      # letting xcodebuild race a cold boot. `./simulator` is the same helper
      # `./profile` and `./flaky` use, so CI and local runs target the device
      # the same way (see "Selecting a simulator" in AGENTS.md).
      # `--shared` takes the image's existing iPhone 17 instead of creating a
      # device of this checkout's own: a job already owns its VM, so the
      # isolation is free here and a fresh device would only add a first-boot
      # data migration to every run (and pile up on a reused runner).
      # Assign first, then echo: a failing command substitution *inside* an
      # argument (`echo "udid=$(./simulator)"`) leaves echo's exit status 0, so
      # the step would pass while writing an empty udid and the run would fail
      # later on an opaque empty destination instead of the script's own error.
      - name: Boot the test simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(./simulator --shared --os 27.0)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # Tests run via the explicit `Stuff-iOS-Tests` scheme (declared in
      # Project.swift) rather than the autogenerated `Stuff-Workspace` scheme.
      # The destination is the UDID booted above, so it can't resolve to some
      # other same-named device. The xcode-27 image ships only the iOS 27.0
      # runtime (Xcode 27 SDK); the deployment target stays iOS 26.0, which the
      # newer SDK builds fine.
      - name: Build & Test (iOS)
        run: mise exec -- tuist test Stuff-iOS-Tests --no-selective-testing -- -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
      # Hosted tests can crash the test-host process on CI without leaving any error
      # in Tuist's summarized log. On failure, capture crash reports + the .xcresult
      # bundle (which holds the per-test crash backtraces) and upload them for analysis.
      - name: Collect test diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics/crashes diagnostics/xcresult
          cp -R "$HOME/Library/Logs/DiagnosticReports/." diagnostics/crashes/ 2>/dev/null || true
          find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -name '*.xcresult' \
            -exec cp -R {} diagnostics/xcresult/ \; 2>/dev/null || true
          cp -R "$HOME/.local/state/tuist/sessions" diagnostics/tuist-sessions 2>/dev/null || true
          echo '--- collected diagnostics ---'
          find diagnostics -maxdepth 3 | head -200
      - name: Upload test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-ios
          path: diagnostics
          if-no-files-found: warn
          retention-days: 7

  snapshot:
    name: Snapshot Tests (iOS)
    needs: format
    # Same image as the `test` job: references are only reproducible against one
    # renderer, so the snapshot job must not lag the toolchain the rest of CI
    # (and every local run) uses.
    runs-on: xcode-27
    # Same stuck-simulator cap as the `test` job above, sized for this job's
    # longer run (~17 minutes with the LFS fetch and the serial capture).
    timeout-minutes: 60
    steps:
      # Reference images live in Git LFS (see .gitattributes), so fetch them —
      # without this the images arrive as pointer files and every comparison fails.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: jdx/mise-action@v3
      # `--shared` for the same reason as the `test` job above, and it matters
      # more here: references are pinned to one renderer, so a freshly created
      # device's first-boot state is exactly the variable to keep out of the run.
      - name: Boot the snapshot simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(./simulator --shared --os 27.0)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # Image snapshots are slow and LFS-backed, so they run in their own job via
      # the standalone `StuffSnapshotTests` scheme (declared in Project.swift)
      # rather than the aggregate `Stuff-iOS-Tests` scheme the `test` job uses.
      # That one scheme covers every module's image suite: they all compile into
      # a single bundle, deliberately — see the `StuffSnapshotTests` comment in
      # Project.swift for why a second snapshot bundle in this process would
      # break the capture pipeline's process-global state.
      #
      # Deliberately NOT `-parallel-testing-enabled`: the capture pipeline is
      # single-tenant — every test renders into the one StuffTestHost key
      # window, and settle loops suspend, so parallel scheduling interleaves
      # tests mid-capture and corrupts each other's images. Verified locally
      # (Xcode 26/iOS 26.2, both worker-count spellings): xcodebuild put all
      # 45 tests on one simulator clone anyway, ran suites concurrently in
      # that one host process, produced 24+ spurious image mismatches, and
      # was ~1.2–3x SLOWER than the serial run (407s/1004s vs ~330s).
      - name: Snapshot Tests (iOS)
        run: mise exec -- tuist test StuffSnapshotTests --no-selective-testing -- -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
      - name: Collect snapshot diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics/crashes diagnostics/xcresult
          cp -R "$HOME/Library/Logs/DiagnosticReports/." diagnostics/crashes/ 2>/dev/null || true
          find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -name '*.xcresult' \
            -exec cp -R {} diagnostics/xcresult/ \; 2>/dev/null || true
          cp -R "$HOME/.local/state/tuist/sessions" diagnostics/tuist-sessions 2>/dev/null || true
          echo '--- collected diagnostics ---'
          find diagnostics -maxdepth 3 | head -200
      - name: Upload snapshot diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diagnostics-ios
          path: diagnostics
          if-no-files-found: warn
          retention-days: 7
