name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: SwiftFormat Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: ./swiftformat --lint

  test:
    name: Build & Test (iOS)
    needs: format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      # Tests run via the explicit `Stuff-iOS-Tests` scheme (declared in
      # Project.swift) rather than the autogenerated `Stuff-Workspace` scheme.
      # Pin the iOS Simulator so hosted tests and signing stay predictable.
      - name: Build & Test (iOS)
        run: mise exec -- tuist test Stuff-iOS-Tests --no-selective-testing -- -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2'
      # Hosted tests can crash the test-host process on CI without leaving any error
      # in Tuist's summarized log. On failure, capture crash reports + the .xcresult
      # bundle (which holds the per-test crash backtraces) and upload them for analysis.
      - name: Collect test diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics/crashes diagnostics/xcresult
          cp -R "$HOME/Library/Logs/DiagnosticReports/." diagnostics/crashes/ 2>/dev/null || true
          find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -name '*.xcresult' \
            -exec cp -R {} diagnostics/xcresult/ \; 2>/dev/null || true
          cp -R "$HOME/.local/state/tuist/sessions" diagnostics/tuist-sessions 2>/dev/null || true
          echo '--- collected diagnostics ---'
          find diagnostics -maxdepth 3 | head -200
      - name: Upload test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-ios
          path: diagnostics
          if-no-files-found: warn
          retention-days: 7
