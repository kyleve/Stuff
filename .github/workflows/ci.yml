name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: SwiftFormat Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: ./swiftformat --lint

  test:
    name: Build & Test (iOS)
    needs: format
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      # The xcode-27 image is a public-preview image whose CoreSimulator can
      # need a nudge to rebuild its device cache before a destination resolves.
      - name: Warm up CoreSimulator
        run: xcrun simctl list > /dev/null
      # Tests run via the explicit `Stuff-iOS-Tests` scheme (declared in
      # Project.swift) rather than the autogenerated `Stuff-Workspace` scheme.
      # Pin the iOS Simulator so hosted tests and signing stay predictable.
      # The xcode-27 image ships only the iOS 27.0 runtime (Xcode 27 SDK); the
      # deployment target stays iOS 26.0, which the newer SDK builds fine.
      - name: Build & Test (iOS)
        run: mise exec -- tuist test Stuff-iOS-Tests --no-selective-testing -- -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0'
      # Hosted tests can crash the test-host process on CI without leaving any error
      # in Tuist's summarized log. On failure, capture crash reports + the .xcresult
      # bundle (which holds the per-test crash backtraces) and upload them for analysis.
      - name: Collect test diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics/crashes diagnostics/xcresult
          cp -R "$HOME/Library/Logs/DiagnosticReports/." diagnostics/crashes/ 2>/dev/null || true
          find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -name '*.xcresult' \
            -exec cp -R {} diagnostics/xcresult/ \; 2>/dev/null || true
          cp -R "$HOME/.local/state/tuist/sessions" diagnostics/tuist-sessions 2>/dev/null || true
          echo '--- collected diagnostics ---'
          find diagnostics -maxdepth 3 | head -200
      - name: Upload test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-ios
          path: diagnostics
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: Build (macOS)
    needs: format
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      # The Porthole suite adds macOS-only targets that the iOS test scheme
      # can't build: the `porthole` command-line tool and the Mac Catalyst
      # `Porthole` app. Build both so a break in the Mac client is caught.
      - name: Build Porthole CLI (macOS)
        run: mise exec -- tuist build PortholeCLI -- -destination 'platform=macOS'
      - name: Build Porthole app (Mac Catalyst)
        run: mise exec -- tuist build PortholeApp -- -destination 'platform=macOS,variant=Mac Catalyst'
